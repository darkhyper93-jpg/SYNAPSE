<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- Only the game's own files may run or load. Inline styles stay allowed: templates set style="--i:…".
         blob: is the logo's generated mask. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>SYNAPSE</title>
    <meta name="description" content="SYNAPSE — adaptive cognitive challenges. The game learns how you play." />
    <meta name="theme-color" content="#05060f" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link rel="stylesheet" href="src/styles/fonts.css" />
    <link rel="stylesheet" href="src/styles/main.css" />
    <link rel="stylesheet" href="src/styles/challenges.css" />
    <link rel="stylesheet" href="src/styles/fx.css" />
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <div id="app"></div>
    <div id="fx-top" aria-hidden="true"></div>
    <noscript>SYNAPSE needs JavaScript.</noscript>
    <link rel="modulepreload" href="src/main.js" />
    <script type="module" src="src/boot.js"></script>
  </body>
</html>
