# Publishes the web version on GitHub Pages (a web app players can install on their phone).
# Every push to the default branch runs lint and tests; only if they pass does it publish. If anything
# fails, nothing is published and the page keeps the last good version.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Web (GitHub Pages)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # other branches build only the Android app (android.yml)
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Engine tests
        run: npm test

  publish:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site folder (only the game's files)
        run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
