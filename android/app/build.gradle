apply plugin: 'com.android.application'

// Release signing (Play Store upload key). Values come from android/keystore.properties
// (local, git-ignored) or from environment variables in CI. Without them, release builds stay unsigned.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String key, String env -> keystoreProps.getProperty(key) ?: System.getenv(env) }
def releaseStoreFile = signingValue('storeFile', 'SYNAPSE_KEYSTORE_FILE')

// versionCode must grow with every Play upload, wherever the build runs (CI, Android Studio, a
// re-run). It is derived from the HEAD commit time: tens of seconds since 2026-01-01, so it is the
// same for the same commit everywhere and stays below Play's limit for centuries.
// VERSION_CODE in the environment overrides it; without git it falls back to 1.
def commitVersionCode = { ->
    try {
        def proc = ['git', 'log', '-1', '--format=%ct'].execute(null, rootDir)
        def out = proc.text.trim()
        proc.waitFor()
        return (proc.exitValue() == 0 && out) ? (((out as long) - 1767225600L).intdiv(10) as int) : 0
    } catch (ignored) {
        return 0
    }
}
def appVersionCode = ((System.getenv('VERSION_CODE') ?: '0') as int) ?: commitVersionCode() ?: 1
// versionName follows package.json (the build number is shown next to it in Settings).
def appVersionName = System.getenv('VERSION_NAME') ?: new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version

android {
    namespace = "com.darkhyper93.synapse"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.darkhyper93.synapse"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // A fixed debug key (not a secret: debug builds can't go to Play) so every test APK built by CI
        // installs over the previous one instead of failing with a signature conflict.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword signingValue('storePassword', 'SYNAPSE_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'SYNAPSE_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'SYNAPSE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (releaseStoreFile) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
